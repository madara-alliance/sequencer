name: Setup CI caches
description: Cache Rust and Python dependencies using the runner's Actions cache backend.

runs:
  using: composite
  steps:
    - name: Cache Rust dependencies and build outputs
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}

    - name: Cache Python downloads
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('scripts/requirements.txt') }}
